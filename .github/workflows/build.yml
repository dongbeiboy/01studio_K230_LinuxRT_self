name: Build & Release

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  # ════════════════════════════════════════════════════════════
  # 手动触发器：免打 tag，按需选择组件
  # ════════════════════════════════════════════════════════════
  workflow_dispatch:
    inputs:
      defconfig:
        description: '选择 defconfig'
        required: true
        type: choice
        default: 'k230_canmv_01studio_defconfig'
        options:
          - k230_canmv_01studio_defconfig
      target:
        description: '构建目标'
        required: true
        type: choice
        default: 'full'
        options:
          - full       # 全量：大核+小核+rootfs+打包镜像+Release
          - big        # 仅大核 (RTT+MPP)
          - little     # 仅小核 (Linux+U-Boot)
          - rootfs     # 仅 rootfs (Buildroot)
          - pack       # 仅打包 (需下方填写 artifact 来源 run ID)
      artifact_run_id:
        description: '【仅 target=pack 需要】artifact 来源的 workflow run ID'
        required: false
        type: string

env:
  BUILD_CONFS: |
    k230_canmv_01studio_defconfig

# ════════════════════════════════════════════════════════════════
# Tag 命名约定
#   v*-full / 无特定后缀  → 全量并行构建 + 发布
#   v*-big                → 仅大核 (RTT+MPP)
#   v*-little             → 仅小核 (Linux+U-Boot)
#   v*-rootfs             → 仅 rootfs (Buildroot)
#   v*-pack               → 仅打包 (workflow_dispatch 更好用)
# ════════════════════════════════════════════════════════════════

jobs:
  # ──────────────────────────────────────────────────────────
  # 轻量门禁：push/PR 每次必跑，0 成本
  # 不响应 tag / workflow_dispatch
  # ──────────────────────────────────────────────────────────
  check:
    name: Check
    if: github.event_name != 'workflow_dispatch' && (github.event_name == 'pull_request' || github.ref_type == 'branch')
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Validate defconfigs
        run: |
          echo "${{ env.BUILD_CONFS }}" | while read -r cfg; do
            [ -z "$cfg" ] && continue
            test -f "configs/$cfg" || { echo "❌ MISSING: configs/$cfg"; exit 1; }
            echo "✅ $cfg"
          done

      - name: ShellCheck scripts
        run: |
          sudo apt-get install -y -qq shellcheck
          find . -name "*.sh" \
            -not -path "*/output/*" \
            -not -path "*/dl/*" \
            -not -path "*/buildroot-*/*" \
            -not -path "*/tools/kconfig/*" \
            -exec shellcheck -S warning {} + 2>/dev/null || true

  # ──────────────────────────────────────────────────────────
  # 大核：RTT / MPP / Big-core OpenSBI
  # 触发: tag *-full/*-big 或 dispatch target=full/big
  # ──────────────────────────────────────────────────────────
  build-big:
    name: "大核 (RTT+MPP)  ${{ matrix.conf }}"
    if: |
      (github.ref_type == 'tag' && (
        contains(github.ref_name, '-big') ||
        contains(github.ref_name, '-full') ||
        !(contains(github.ref_name, '-little') || contains(github.ref_name, '-rootfs') || contains(github.ref_name, '-pack'))
      ))
      ||
      (github.event_name == 'workflow_dispatch' && (
        github.event.inputs.target == 'full' || github.event.inputs.target == 'big'
      ))
    runs-on: ubuntu-22.04
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        conf:
          - k230_canmv_01studio_defconfig
    env:
      # dispatch 时用输入的 defconfig，tag 时用矩阵值
      CONF: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.defconfig || matrix.conf }}

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install system dependencies
        run: |
          sudo dpkg --add-architecture i386
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends \
            cmake flex bison m4 fakeroot attr zlib1g-dev \
            bc cpio unzip rsync file make binutils build-essential \
            gcc g++ bash patch gzip bzip2 perl tar dosfstools mtools \
            autoconf automake pkg-config libc6-dev-i386 libncurses5:i386 \
            libssl-dev libncurses5-dev libconfuse2 libconfuse-dev \
            python3 python3-pip python-is-python3 scons wget curl ccache
          pip3 install pycryptodome gmssl


      - name: Restore toolchain cache
        id: cache-tc
        uses: actions/cache@v4
        with:
          path: toolchain
          key: toolchain-${{ env.CONF }}-${{ hashFiles('Makefile', 'configs/${{ env.CONF }}') }}-v4

      - name: Restore source cache
        id: cache-src
        uses: actions/cache@v4
        with:
          path: |
            src/.src_fetched
            src/big/utils
            src/big/ai
            src/big/kmodel
            src/big/nncase
            src/little/utils/firmware
            src/little/buildroot-ext/dl
            src/little/buildroot-ext/package/tuning-server
            src/little/buildroot-ext/buildroot-*
          key: sources-${{ env.CONF }}-${{ hashFiles('Makefile', 'configs/${{ env.CONF }}', '.github/patches/**') }}-v8

      - name: Mark toolchain ready (cache hit)
        if: steps.cache-tc.outputs.cache-hit == 'true'
        run: mkdir -p toolchain && touch toolchain/.toolchain_ready

      - name: Prepare toolchain & sources
        if: steps.cache-tc.outputs.cache-hit != 'true' || steps.cache-src.outputs.cache-hit != 'true'
        run: make prepare_sourcecode CONF=${{ env.CONF }}

      - name: Link toolchain to /opt/toolchain
        run: sudo rm -rf /opt/toolchain && sudo ln -s "$(pwd)/toolchain" /opt/toolchain

      - name: Setup ccache wrapper for RTT toolchain (musl)
        run: |
          echo "CCACHE_DIR=${{ github.workspace }}/.ccache-rtt" >> $GITHUB_ENV
          echo "CCACHE_COMPILERCHECK=content"               >> $GITHUB_ENV
          echo "CCACHE_MAXSIZE=2G"                          >> $GITHUB_ENV
          echo "CCACHE_COMPRESS=1"                          >> $GITHUB_ENV
          TC_BIN=/opt/toolchain/riscv64-linux-musleabi_for_x86_64-pc-linux-gnu/bin
          for prog in gcc g++ cc cpp; do
            BIN="$TC_BIN/riscv64-unknown-linux-musl-$prog"
            if [ -f "$BIN" ] && [ ! -f "$BIN.real" ]; then
              sudo mv "$BIN" "$BIN.real"
              printf '#!/bin/sh\nexec ccache %s "$@"\n' "$BIN.real" | sudo tee "$BIN" > /dev/null
              sudo chmod +x "$BIN"
            fi
          done

      - name: Restore ccache (rtt)
        uses: actions/cache/restore@v4
        with:
          path: ${{ github.workspace }}/.ccache-rtt
          key: ccache-rtt-${{ env.CONF }}-${{ github.run_id }}
          restore-keys: ccache-rtt-${{ env.CONF }}-

      - name: Build big core (RTT + MPP + OpenSBI)
        run: make CONF=${{ env.CONF }} rt-smart
        env:
          PATH: /usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
        timeout-minutes: 150

      - name: Show ccache stats (rtt)
        run: CCACHE_DIR=${{ github.workspace }}/.ccache-rtt ccache -s

      - name: Save ccache (rtt)
        if: always()
        uses: actions/cache/save@v4
        with:
          path: ${{ github.workspace }}/.ccache-rtt
          key: ccache-rtt-${{ env.CONF }}-${{ github.run_id }}

      - name: Upload big core outputs
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.CONF }}-big
          path: |
            output/${{ env.CONF }}/big/
            output/${{ env.CONF }}/common/
            src/big/rt-smart/userapps/root/
            src/common/cdk/user/out/big/*
          retention-days: 1

  # ──────────────────────────────────────────────────────────
  # 小核：Linux + U-Boot + little-core OpenSBI
  # 触发: tag *-full/*-little 或 dispatch target=full/little
  # ──────────────────────────────────────────────────────────
  build-little:
    name: "小核 (Linux+U-Boot)  ${{ matrix.conf }}"
    if: |
      (github.ref_type == 'tag' && (
        contains(github.ref_name, '-little') ||
        contains(github.ref_name, '-full') ||
        !(contains(github.ref_name, '-big') || contains(github.ref_name, '-rootfs') || contains(github.ref_name, '-pack'))
      ))
      ||
      (github.event_name == 'workflow_dispatch' && (
        github.event.inputs.target == 'full' || github.event.inputs.target == 'little'
      ))
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        conf:
          - k230_canmv_01studio_defconfig
    env:
      CONF: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.defconfig || matrix.conf }}

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install system dependencies
        run: |
          sudo dpkg --add-architecture i386
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends \
            cmake flex bison m4 fakeroot attr zlib1g-dev \
            bc cpio unzip rsync file make binutils build-essential \
            gcc g++ bash patch gzip bzip2 perl tar dosfstools mtools \
            autoconf automake pkg-config libc6-dev-i386 libncurses5:i386 \
            libssl-dev libncurses5-dev libconfuse2 libconfuse-dev \
            python3 python3-pip python-is-python3 scons wget curl ccache
          pip3 install pycryptodome gmssl


      - name: Restore toolchain cache
        id: cache-tc
        uses: actions/cache@v4
        with:
          path: toolchain
          key: toolchain-${{ env.CONF }}-${{ hashFiles('Makefile', 'configs/${{ env.CONF }}') }}-v4

      - name: Restore source cache
        id: cache-src
        uses: actions/cache@v4
        with:
          path: |
            src/.src_fetched
            src/big/utils
            src/big/ai
            src/big/kmodel
            src/big/nncase
            src/little/utils/firmware
            src/little/buildroot-ext/dl
            src/little/buildroot-ext/package/tuning-server
            src/little/buildroot-ext/buildroot-*
          key: sources-${{ env.CONF }}-${{ hashFiles('Makefile', 'configs/${{ env.CONF }}', '.github/patches/**') }}-v8

      - name: Mark toolchain ready (cache hit)
        if: steps.cache-tc.outputs.cache-hit == 'true'
        run: mkdir -p toolchain && touch toolchain/.toolchain_ready

      - name: Prepare toolchain & sources
        if: steps.cache-tc.outputs.cache-hit != 'true' || steps.cache-src.outputs.cache-hit != 'true'
        run: make prepare_sourcecode CONF=${{ env.CONF }}

      - name: Link toolchain to /opt/toolchain
        run: sudo rm -rf /opt/toolchain && sudo ln -s "$(pwd)/toolchain" /opt/toolchain

      - name: Setup ccache wrapper for Linux toolchain
        run: |
          echo "CCACHE_DIR=${{ github.workspace }}/.ccache" >> $GITHUB_ENV
          echo "CCACHE_COMPILERCHECK=content"       >> $GITHUB_ENV
          echo "CCACHE_MAXSIZE=2G"                  >> $GITHUB_ENV
          echo "CCACHE_COMPRESS=1"                  >> $GITHUB_ENV
          TC_BIN=/opt/toolchain/Xuantie-900-gcc-linux-5.10.4-glibc-x86_64-V2.6.0/bin
          for prog in gcc g++ cc cpp; do
            BIN="$TC_BIN/riscv64-unknown-linux-gnu-$prog"
            if [ -f "$BIN" ] && [ ! -f "$BIN.real" ]; then
              sudo mv "$BIN" "$BIN.real"
              printf '#!/bin/sh\nexec ccache %s "$@"\n' "$BIN.real" | sudo tee "$BIN" > /dev/null
              sudo chmod +x "$BIN"
            fi
          done

      - name: Restore ccache (linux)
        uses: actions/cache/restore@v4
        with:
          path: ${{ github.workspace }}/.ccache
          key: ccache-linux-${{ env.CONF }}-${{ github.run_id }}
          restore-keys: ccache-linux-${{ env.CONF }}-

      - name: Build linux
        run: make CONF=${{ env.CONF }} linux
        env:
          PATH: /usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
        timeout-minutes: 60

      - name: Build uboot + opensbi (skip linux)
        run: make CONF=${{ env.CONF }} uboot little-core-opensbi -o linux
        env:
          PATH: /usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
        timeout-minutes: 20

      - name: Show ccache stats
        run: ccache -s

      - name: Save ccache (linux)
        if: always()
        uses: actions/cache/save@v4
        with:
          path: ${{ github.workspace }}/.ccache
          key: ccache-linux-${{ env.CONF }}-${{ github.run_id }}

      - name: Remove kernel source symlinks (prevent 1.3GB artifact bloat)
        run: |
          MODLIB="output/${{ env.CONF }}/little/linux/rootfs/lib/modules"
          if [ -d "$MODLIB" ]; then
            for d in "$MODLIB"/*/; do
              [ -d "$d" ] || continue
              rm -f "$d/build" "$d/source"
              echo "✅ removed symlinks from $(basename "$d")"
            done
          fi

      - name: Upload linux/uboot/opensbi outputs
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.CONF }}-little
          path: |
            output/${{ env.CONF }}/little/linux/arch/riscv/boot/Image
            output/${{ env.CONF }}/little/linux/rootfs/
            output/${{ env.CONF }}/little/linux/scripts/dtc/dtc
            output/${{ env.CONF }}/little/uboot/tools/mkimage
            output/${{ env.CONF }}/little/uboot/tools/mkenvimage
            output/${{ env.CONF }}/little/uboot/u-boot.bin
            output/${{ env.CONF }}/little/uboot/u-boot-spl.bin
            output/${{ env.CONF }}/common/little-opensbi/
          retention-days: 1

  # ──────────────────────────────────────────────────────────
  # rootfs：Buildroot（独立并行）
  # 触发: tag *-full/*-rootfs 或 dispatch target=full/rootfs
  # ──────────────────────────────────────────────────────────
  build-rootfs:
    name: "RootFS (Buildroot)  ${{ matrix.conf }}"
    if: |
      (github.ref_type == 'tag' && (
        contains(github.ref_name, '-rootfs') ||
        contains(github.ref_name, '-full') ||
        !(contains(github.ref_name, '-big') || contains(github.ref_name, '-little') || contains(github.ref_name, '-pack'))
      ))
      ||
      (github.event_name == 'workflow_dispatch' && (
        github.event.inputs.target == 'full' || github.event.inputs.target == 'rootfs'
      ))
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        conf:
          - k230_canmv_01studio_defconfig
    env:
      CONF: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.defconfig || matrix.conf }}

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install system dependencies
        run: |
          sudo dpkg --add-architecture i386
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends \
            cmake flex bison m4 fakeroot attr zlib1g-dev \
            bc cpio unzip rsync file make binutils build-essential \
            gcc g++ bash patch gzip bzip2 perl tar dosfstools mtools \
            autoconf automake pkg-config libc6-dev-i386 libncurses5:i386 \
            libssl-dev libncurses5-dev libconfuse2 libconfuse-dev \
            python3 python3-pip python-is-python3 scons wget curl
          pip3 install pycryptodome gmssl


      - name: Restore toolchain cache
        id: cache-tc
        uses: actions/cache@v4
        with:
          path: toolchain
          key: toolchain-${{ env.CONF }}-${{ hashFiles('Makefile', 'configs/${{ env.CONF }}') }}-v4

      - name: Restore source cache
        id: cache-src
        uses: actions/cache@v4
        with:
          path: |
            src/.src_fetched
            src/big/utils
            src/big/ai
            src/big/kmodel
            src/big/nncase
            src/little/utils/firmware
            src/little/buildroot-ext/dl
            src/little/buildroot-ext/package/tuning-server
            src/little/buildroot-ext/buildroot-*
          key: sources-${{ env.CONF }}-${{ hashFiles('Makefile', 'configs/${{ env.CONF }}', '.github/patches/**') }}-v8

      - name: Mark toolchain ready (cache hit)
        if: steps.cache-tc.outputs.cache-hit == 'true'
        run: mkdir -p toolchain && touch toolchain/.toolchain_ready

      - name: Prepare toolchain & sources
        if: steps.cache-tc.outputs.cache-hit != 'true' || steps.cache-src.outputs.cache-hit != 'true'
        run: make prepare_sourcecode CONF=${{ env.CONF }}

      - name: Link toolchain to /opt/toolchain
        run: sudo rm -rf /opt/toolchain && sudo ln -s "$(pwd)/toolchain" /opt/toolchain


      - name: Build buildroot
        run: |
          # ── 确保 buildroot 源码已解压（cache miss 时源码还是 tarball，patch 无法拷贝）──
          BRW_ROOT="src/little/buildroot-ext"
          if ! ls -d "$BRW_ROOT"/buildroot-*/ 2>/dev/null | head -1 | grep -q buildroot; then
            TAR=$(ls "$BRW_ROOT"/dl/buildroot-*.tar.gz 2>/dev/null | head -1)
            [ -n "$TAR" ] && { echo "📦 cache miss — extracting buildroot first..."; tar --no-same-owner -zxf "$TAR" -C "$BRW_ROOT"; } \
              || { echo "❌ FATAL: no buildroot tarball found in $BRW_ROOT/dl/"; exit 1; }
          fi
          # ── 安装 fakeroot patch 到 buildroot 包目录（buildroot 每次提取源码自动 apply）──
          PATCHDIR="$(dirname "$(ls src/little/buildroot-ext/buildroot-*/package/fakeroot/fakeroot.mk 2>/dev/null | head -1)")"
          if [ ! -d "$PATCHDIR" ]; then
            echo "❌ FATAL: PATCHDIR not found — buildroot not extracted?"; exit 1
          fi
          cp .github/patches/0002-fix-stat-ver-glibc235.patch "$PATCHDIR/"
          echo "✅ fakeroot _STAT_VER patch installed to $PATCHDIR"
          # ── 安装 m4 SIGSTKSZ patch ──
          M4PATCHDIR="$(dirname "$(ls src/little/buildroot-ext/buildroot-*/package/m4/m4.mk 2>/dev/null | head -1)")"
          if [ -d "$M4PATCHDIR" ]; then
            cp .github/patches/0003-fix-m4-sigstksz.patch "$M4PATCHDIR/"
            echo "✅ m4 SIGSTKSZ patch installed to $M4PATCHDIR"
          fi
          OUT="output/${{ env.CONF }}/little/buildroot-ext/build"
          FB="output/${{ env.CONF }}/little/buildroot-ext/host/bin"
          CPIO="output/${{ env.CONF }}/little/buildroot-ext/images/rootfs.cpio"
          # ── 清理 Xuantie-900 sysroot 中的符号链接环（防止 toolchain copy 步骤无限挂死）──
          XT_SYSROOT="$(pwd)/output/${{ env.CONF }}/little/buildroot-ext/host/riscv64-buildroot-linux-gnu/sysroot"
          if [ -d "$XT_SYSROOT" ]; then
            echo "🔍 Checking for symlink loops in Xuantie sysroot..."
            find -L "$XT_SYSROOT" -xtype l -delete 2>/dev/null || true
            echo "✅ Symlink cleanup done"
          fi
          # ── Round 1: buildroot 全量跑（timeout 10min，toolchain copy 可能挂死）──
          echo "═══ Round 1: configure + extract (timeout 10min) ═══"
          timeout 600 make CONF=${{ env.CONF }} buildroot 2>&1 || echo "⚠️ Round 1 timed out / failed (expected, proceeding to fixes)"
          # ── Patch m4 SIGSTKSZ (glibc 2.35) ──
          M4F="$OUT/host-m4-1.4.18/lib/c-stack.c"
          if [ -f "$M4F" ]; then
            sed -i 's|# *if.*SIGSTKSZ *< *16384|#if 0 /* CI */|' "$M4F"
            sed -i 's|# *elif.*SIGSTKSZ *< *16384|#elif 0 /* CI */|' "$M4F"
            rm -f "$OUT/host-m4-1.4.18/.stamp_built"
            echo "✅ patched m4"
          fi
          # ── 修复 buildroot 交叉编译器 wrapper（模拟原生 wrapper 行为）──
          WRAP="output/${{ env.CONF }}/little/buildroot-ext/host/bin"
          REAL="/opt/toolchain/Xuantie-900-gcc-linux-5.10.4-glibc-x86_64-V2.6.0/bin/riscv64-unknown-linux-gnu"
          SYSROOT="$(pwd)/output/${{ env.CONF }}/little/buildroot-ext/host/riscv64-buildroot-linux-gnu/sysroot"
          if [ -d "$WRAP" ] && [ -f "$REAL-gcc" ] && [ -d "$SYSROOT" ]; then
            # 编译器 (gcc/g++/cpp): 传入 --sysroot -mabi -march（模拟 toolchain-wrapper）
            for tool in gcc g++ cpp; do
              W="$WRAP/riscv64-unknown-linux-gnu-$tool"
              [ -f "$W" ] && printf '#!/bin/sh\nexec %s-%s --sysroot "%s" -mabi=lp64d -march=rv64imafdcxthead "$@"\n' "$REAL" "$tool" "$SYSROOT" > "$W" && chmod +x "$W"
            done
            # 其余工具(binutils): 简单 passthrough
            for tool in ld ar as nm ranlib strip objcopy objdump readelf; do
              W="$WRAP/riscv64-unknown-linux-gnu-$tool"
              [ -f "$W" ] && printf '#!/bin/sh\nexec %s-%s "$@"\n' "$REAL" "$tool" > "$W" && chmod +x "$W"
            done
            echo "✅ cross-compiler wrappers fixed (sysroot+mabi+march for gcc/g++/cpp)"
          fi
          # ── Stub makedevs + 删 cpio.mk mknod ──
          if [ -f "$FB/makedevs" ] && ! grep -q 'CI-NOOP' "$FB/makedevs" 2>/dev/null; then
            mv "$FB/makedevs" "$FB/makedevs.real"
            printf '#!/bin/sh\necho "[CI-NOOP] makedevs skipped"\nexit 0\n' > "$FB/makedevs"
            chmod +x "$FB/makedevs"
          fi
          CPIO_MK="$(ls src/little/buildroot-ext/buildroot-*/fs/cpio/cpio.mk 2>/dev/null | head -1)"
          [ -f "$CPIO_MK" ] && sed -i 's/^\t*mknod /#CI-DISABLED mknod /' "$CPIO_MK"
          # ── Round 2: 增量重编（不再吞错误，暴露真实失败点）──
          echo "═══ Round 2: rebuild ═══"
          make CONF=${{ env.CONF }} buildroot-rebuild 2>&1
          # ── 所有 buildroot 调用已完成，makedevs stub 不会被覆盖了 ──
          TGT="output/${{ env.CONF }}/little/buildroot-ext/build/buildroot-fs/cpio/target"
          mkdir -p "$TGT/dev"
          for n in null console zero mem ttyS0 ttyAMA0; do touch "$TGT/dev/$n"; done
          if [ -f "$FB/makedevs.real" ] || file "$FB/makedevs" 2>/dev/null | grep -q ELF; then
            mv -f "$FB/makedevs" "$FB/makedevs.real" 2>/dev/null || true
            printf '#!/bin/sh\necho "[CI-NOOP] makedevs skipped"\nexit 0\n' > "$FB/makedevs"
            chmod +x "$FB/makedevs"
            echo "✅ makedevs stubbed after all builds"
          fi
          # ── 手动 cpio 修复（兜底）──
          FSCR="output/${{ env.CONF }}/little/buildroot-ext/build/buildroot-fs/cpio/fakeroot"
          if [ -f "$FSCR" ] && [ ! -f "$CPIO" ]; then
            echo "🔧 Manual cpio..."
            sed -i '/mknod /s/^/echo [SKIP] /' "$FSCR"
            sed -i '/makedevs /s/^/echo [SKIP] /' "$FSCR"
            sed -i '/chown -h -R 0:0/s/^/echo [SKIP] /' "$FSCR"
            PATH="$FB:$FB/../sbin:$PATH" bash "$FSCR" && touch "$CPIO" && echo "✅ cpio done"
            make CONF=${{ env.CONF }} buildroot-rebuild 2>&1
          fi
          # ── 校验 ──
          ls -la output/${{ env.CONF }}/little/buildroot-ext/images/ || \
            { echo "❌ images/ missing"; exit 1; }
        timeout-minutes: 80

      - name: Upload buildroot outputs
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.CONF }}-rootfs
          path: |
            output/${{ env.CONF }}/little/buildroot-ext/images/
            output/${{ env.CONF }}/little/buildroot-ext/host/sbin/mkfs.ext4
          retention-days: 1

  # ──────────────────────────────────────────────────────────
  # 打包镜像：合并三个上游 artifact → genimage → 最终镜像
  # 触发: tag *-full 或 dispatch target=full/pack
  # ⚠️ pack 模式需要先有一轮 full 构建产生 artifact
  # ──────────────────────────────────────────────────────────
  merge:
    name: "打包镜像  ${{ matrix.conf }}"
    if: |
      (github.ref_type == 'tag' && (
        contains(github.ref_name, '-full') ||
        !(contains(github.ref_name, '-big') || contains(github.ref_name, '-little') || contains(github.ref_name, '-rootfs') || contains(github.ref_name, '-pack'))
      ))
      ||
      (github.event_name == 'workflow_dispatch' && (
        github.event.inputs.target == 'full' || github.event.inputs.target == 'pack'
      ))
    needs: [build-big, build-little, build-rootfs]
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        conf:
          - k230_canmv_01studio_defconfig
    env:
      CONF: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.defconfig || matrix.conf }}
      # pack 模式从指定 run 拉 artifact；full 模式从当前 run 拉
      ARTIFACT_RUN: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.target == 'pack' && github.event.inputs.artifact_run_id || github.run_id }}

    steps:
      - uses: actions/checkout@v4

      - name: Install genimage + tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends \
            fakeroot dosfstools mtools cpio unzip rsync file bc \
            libconfuse2 libconfuse-dev
          wget -q https://github.com/pengutronix/genimage/releases/download/v16/genimage-16.tar.xz \
            -O /tmp/genimage.tar.xz
          cd /tmp && tar -xf genimage.tar.xz
          cd genimage-16 && ./configure && make -j"$(nproc)" && sudo make install

      - name: Restore source cache
        uses: actions/cache/restore@v4
        with:
          path: |
            src/.src_fetched
            src/big/utils
            src/big/ai
            src/big/kmodel
            src/big/nncase
            src/little/utils/firmware
            src/little/buildroot-ext/dl
            src/little/buildroot-ext/package/tuning-server
            src/little/buildroot-ext/buildroot-*
          key: sources-${{ env.CONF }}-${{ hashFiles('Makefile', 'configs/${{ env.CONF }}', '.github/patches/**') }}-v8

      - name: Prepare output structure
        run: mkdir -p output/${{ env.CONF }}/images

      - name: Restore toolchain
        uses: actions/cache@v4
        with:
          path: toolchain
          key: toolchain-${{ env.CONF }}-${{ hashFiles('Makefile', 'configs/${{ env.CONF }}') }}-v4

      - name: Link toolchain to /opt/toolchain
        run: |
          sudo rm -rf /opt/toolchain && sudo ln -s "$(pwd)/toolchain" /opt/toolchain
          ls /opt/toolchain/*/bin/*gcc 2>/dev/null || echo "⚠️ toolchain incomplete — check may fail"

      - name: Download big core artifact
        uses: actions/download-artifact@v4
        with:
          name: ${{ env.CONF }}-big
          path: .
          run-id: ${{ env.ARTIFACT_RUN }}

      - name: Download little core artifact
        uses: actions/download-artifact@v4
        with:
          name: ${{ env.CONF }}-little
          path: .
          run-id: ${{ env.ARTIFACT_RUN }}

      - name: Download rootfs artifact
        uses: actions/download-artifact@v4
        with:
          name: ${{ env.CONF }}-rootfs
          path: .
          run-id: ${{ env.ARTIFACT_RUN }}

      - name: Build image
        run: |
          mkdir -p output/${{ env.CONF }}/images
          cp configs/${{ env.CONF }} .config
          echo "CONF=${{ env.CONF }}" > .last_conf
          export K230_SDK_ROOT="$(pwd)"
          export BUILD_DIR="$(pwd)/output/${{ env.CONF }}"
          export RTT_SDK_BUILD_DIR="${BUILD_DIR}/big/rt-smart"
          export MPP_BUILD_DIR="${BUILD_DIR}/big/mpp"
          export BIG_OPENSBI_BUILD_DIR="${BUILD_DIR}/common/big-opensbi"
          export LITTLE_OPENSBI_BUILD_DIR="${BUILD_DIR}/common/little-opensbi"
          export CDK_BUILD_DIR="${BUILD_DIR}/common/cdk"
          export LINUX_BUILD_DIR="${BUILD_DIR}/little/linux"
          export BUILDROOT_BUILD_DIR="${BUILD_DIR}/little/buildroot-ext"
          export UBOOT_BUILD_DIR="${BUILD_DIR}/little/uboot"
          export IMAGE_DIR="${BUILD_DIR}/images"
          export RTSMART_SRC_DIR="${K230_SDK_ROOT}/src/big/rt-smart"
          bash board/common/gen_image_script/gen_image.sh

      - name: Package release
        run: |
          mkdir -p release
          IMG="output/${{ env.CONF }}/images/sysimage-sdcard.img.gz"
          if [ -f "$IMG" ]; then
            cp "$IMG" "release/${{ env.CONF }}_sysimage-sdcard.img.gz"
            ls -lh release/
          else
            echo "❌ Image not found: $IMG"
            find output/${{ env.CONF }}/images/ -type f | head -20
            exit 1
          fi

      - name: Upload final image
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.CONF }}
          path: release/
          retention-days: 7

  # ──────────────────────────────────────────────────────────
  # GitHub Release：全量构建才发布
  # 触发: tag *-full 或 dispatch target=full
  # ──────────────────────────────────────────────────────────
  release:
    name: GitHub Release
    if: |
      (github.ref_type == 'tag' && (
        contains(github.ref_name, '-full') ||
        !(contains(github.ref_name, '-big') || contains(github.ref_name, '-little') || contains(github.ref_name, '-rootfs') || contains(github.ref_name, '-pack'))
      ))
      ||
      (github.event_name == 'workflow_dispatch' && github.event.inputs.target == 'full')
    needs: merge
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: 'k230_canmv*'
          merge-multiple: true
          path: release

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ github.ref_name }}
          files: release/*
          generate_release_notes: true
