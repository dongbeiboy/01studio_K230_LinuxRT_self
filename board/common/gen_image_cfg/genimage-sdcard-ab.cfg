# genimage-sdcard-ab.cfg — A/B 升级镜像分区布局
# MBR 分区表（仅 3 个 MBR 条目）:
#   p1: rootfs_A  (128M)
#   p2: rootfs_B  (502M)
#   p3: app.vfat  (758M)
#
# RTT/Linux 标记为 in-partition-table=false（U-Boot 按裸偏移读取）

image sysimage-sdcard-ab.img {
	hdimage {
		gpt = "false"
	}

	# === Boot 区（不动，与现有镜像兼容）===
	partition uboot_spl_1 {
		in-partition-table = false
		offset = 1M
		image = "little-core/uboot/fn_u-boot-spl.bin"
	}
	partition uboot_spl_2 {
		in-partition-table = false
		offset = 0x180000
		image = "little-core/uboot/fn_u-boot-spl.bin"
	}
	partition uboot_env {
		in-partition-table = false
		offset = 0x1e0000
		image = "little-core/uboot/env.env"
		size = 0x10000
	}
	partition uboot {
		in-partition-table = false
		offset = 2M
		image = "little-core/uboot/fn_ug_u-boot.bin"
	}

	# === Slot A ===
	partition rtt_a {
		in-partition-table = false
		offset = 10M
		image = "big-core/rtt_system.bin"
		size = 20M
	}
	partition linux_a {
		in-partition-table = false
		offset = 30M
		image = "little-core/linux_system.bin"
		size = 50M
	}
	partition rootfs_a {
		offset = 128M
		partition-type = 0x83
		image = "little-core/rootfs.ext4"
	}

	# === Slot B ===
	partition rtt_b {
		in-partition-table = false
		offset = 384M
		image = "big-core/rtt_system.bin"
		size = 20M
	}
	partition linux_b {
		in-partition-table = false
		offset = 404M
		image = "little-core/linux_system.bin"
		size = 50M
	}
	partition rootfs_b {
		offset = 502M
		partition-type = 0x83
		image = "little-core/rootfs.ext4"
	}

	# === App 分区 ===
	partition fat32appfs {
		offset = 758M
		partition-type = 0xc
		image = "app.vfat"
		size = 256M
	}
}
