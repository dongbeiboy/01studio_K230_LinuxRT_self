name: Build & Release

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]

env:
  BUILD_CONFS: |
    k230_canmv_01studio_defconfig
    k230_canmv_defconfig

jobs:
  # ============================================================
  # 轻量门禁：每次 push/PR 跑（不打 tag 时）
  # ============================================================
  check:
    name: Check
    if: github.ref_type == 'branch'
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Validate defconfigs
        run: |
          echo "${{ env.BUILD_CONFS }}" | while read -r cfg; do
            [ -z "$cfg" ] && continue
            test -f "configs/$cfg" || { echo "❌ MISSING: configs/$cfg"; exit 1; }
            echo "✅ $cfg"
          done

      - name: ShellCheck scripts
        run: |
          sudo apt-get install -y -qq shellcheck
          find . -name "*.sh" \
            -not -path "*/output/*" \
            -not -path "*/dl/*" \
            -not -path "*/buildroot-*/*" \
            -not -path "*/tools/kconfig/*" \
            -exec shellcheck -S warning {} + 2>/dev/null || true

  # ============================================================
  # 全量编译：打 tag v* 时触发
  # ============================================================
  build:
    name: Build ${{ matrix.conf }}
    if: github.ref_type == 'tag'
    runs-on: ubuntu-22.04
    timeout-minutes: 360
    strategy:
      fail-fast: false
      matrix:
        conf:
          - k230_canmv_01studio_defconfig
          - k230_canmv_defconfig

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # ---- 系统依赖 ----
      - name: Install system dependencies
        run: |
          sudo dpkg --add-architecture i386
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends \
            cmake flex bison m4 fakeroot attr zlib1g-dev \
            bc cpio unzip rsync file make binutils build-essential \
            gcc g++ bash patch gzip bzip2 perl tar dosfstools mtools \
            autoconf automake pkg-config libc6-dev-i386 libncurses5:i386 \
            libssl-dev libncurses5-dev libconfuse2 libconfuse-dev \
            python3 python3-pip python-is-python3 scons wget curl
          pip3 install pycryptodome gmssl

      - name: Install genimage
        run: |
          wget -q https://github.com/pengutronix/genimage/releases/download/v16/genimage-16.tar.xz \
            -O /tmp/genimage.tar.xz
          cd /tmp && tar -xf genimage.tar.xz
          cd genimage-16
          ./configure && make -j"$(nproc)" && sudo make install
          genimage --version

      # ---- 缓存：工具链 (~1.5GB) ----
      - name: Restore toolchain cache
        id: cache-tc
        uses: actions/cache@v4
        with:
          path: toolchain
          key: toolchain-${{ hashFiles('Makefile') }}-v1

      - name: Mark toolchain ready (cache hit)
        if: steps.cache-tc.outputs.cache-hit == 'true'
        run: |
          mkdir -p toolchain
          touch toolchain/.toolchain_ready
          echo "✅ Toolchain restored from cache"

      # ---- 缓存：源码下载 ----
      - name: Restore source cache
        id: cache-src
        uses: actions/cache@v4
        with:
          path: |
            src/.src_fetched
            src/big/utils
            src/big/ai
            src/big/kmodel
            src/big/nncase
            src/little/utils/firmware
            src/little/buildroot-ext/dl
            src/little/buildroot-ext/package/tuning-server
          key: sources-${{ hashFiles('Makefile') }}-v1

      - name: Prepare source code
        run: |
          if [ -f src/.src_fetched ] && [ -f toolchain/.toolchain_ready ]; then
            echo "✅ All sources and toolchains cached — skip download"
          else
            echo "⬇ Downloading toolchains + sources..."
            make prepare_sourcecode
            echo "✅ Download complete"
          fi
        env:
          CONF: ${{ matrix.conf }}

      # ---- 编译 ----
      - name: Build SDK
        run: |
          make CONF=${{ matrix.conf }}
        env:
          PATH: /usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
        timeout-minutes: 300

      # ---- 打包产物 ----
      - name: Package release artifacts
        run: |
          mkdir -p release
          IMG="output/${{ matrix.conf }}/images/sysimage-sdcard.img.gz"
          if [ -f "$IMG" ]; then
            cp "$IMG" "release/${{ matrix.conf }}_sysimage-sdcard.img.gz"
            ls -lh release/
          else
            echo "⚠️ Image not found: $IMG"
            ls -lR output/${{ matrix.conf }}/images/ || true
            exit 1
          fi

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.conf }}
          path: release/
          retention-days: 7

  # ============================================================
  # GitHub Release：汇总全部构建产物
  # ============================================================
  release:
    name: GitHub Release
    if: github.ref_type == 'tag'
    needs: build
    runs-on: ubuntu-22.04
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: 'k230_canmv*'
          merge-multiple: true
          path: release

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ github.ref_name }}
          files: release/*
          generate_release_notes: true
