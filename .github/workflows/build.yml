name: Build & Release

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]

env:
  BUILD_CONFS: |
    k230_canmv_01studio_defconfig

jobs:
  # ============================================================
  # 轻量门禁：每次 push/PR 跑（不打 tag 时）
  # ============================================================
  check:
    name: Check
    if: github.event_name == 'pull_request' || github.ref_type == 'branch'
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Validate defconfigs
        run: |
          echo "${{ env.BUILD_CONFS }}" | while read -r cfg; do
            [ -z "$cfg" ] && continue
            test -f "configs/$cfg" || { echo "❌ MISSING: configs/$cfg"; exit 1; }
            echo "✅ $cfg"
          done

      - name: ShellCheck scripts
        run: |
          sudo apt-get install -y -qq shellcheck
          find . -name "*.sh" \
            -not -path "*/output/*" \
            -not -path "*/dl/*" \
            -not -path "*/buildroot-*/*" \
            -not -path "*/tools/kconfig/*" \
            -exec shellcheck -S warning {} + 2>/dev/null || true

  # ============================================================
  # 全量编译（并行）：大核 + 小核 同时构建
  # ============================================================

  # ── 大核：RTT / MPP / Big-core OpenSBI ──
  build-big:
    name: "大核 (RTT+MPP)  ${{ matrix.conf }}"
    if: github.ref_type == 'tag'
    runs-on: ubuntu-22.04
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        conf:
          - k230_canmv_01studio_defconfig

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install system dependencies
        run: |
          sudo dpkg --add-architecture i386
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends \
            cmake flex bison m4 fakeroot attr zlib1g-dev \
            bc cpio unzip rsync file make binutils build-essential \
            gcc g++ bash patch gzip bzip2 perl tar dosfstools mtools \
            autoconf automake pkg-config libc6-dev-i386 libncurses5:i386 \
            libssl-dev libncurses5-dev libconfuse2 libconfuse-dev \
            python3 python3-pip python-is-python3 scons wget curl
          pip3 install pycryptodome gmssl


      - name: Restore toolchain cache
        id: cache-tc
        uses: actions/cache@v4
        with:
          path: toolchain
          key: toolchain-${{ matrix.conf }}-${{ hashFiles('Makefile', 'configs/k230_canmv_01studio_defconfig') }}-v4

      - name: Restore source cache
        id: cache-src
        uses: actions/cache@v4
        with:
          path: |
            src/.src_fetched
            src/big/utils
            src/big/ai
            src/big/kmodel
            src/big/nncase
            src/little/utils/firmware
            src/little/buildroot-ext/dl
            src/little/buildroot-ext/package/tuning-server
          key: sources-${{ matrix.conf }}-${{ hashFiles('Makefile', 'configs/k230_canmv_01studio_defconfig') }}-v4

      - name: Mark toolchain ready (cache hit)
        if: steps.cache-tc.outputs.cache-hit == 'true'
        run: mkdir -p toolchain && touch toolchain/.toolchain_ready

      - name: Prepare toolchain & sources
        if: steps.cache-tc.outputs.cache-hit != 'true' || steps.cache-src.outputs.cache-hit != 'true'
        run: make prepare_sourcecode CONF=${{ matrix.conf }}

      - name: Link toolchain to /opt/toolchain
        run: sudo ln -sf "$(pwd)/toolchain" /opt/toolchain


      - name: Build big core (RTT + MPP + OpenSBI)
        run: make CONF=${{ matrix.conf }} rt-smart
        env:
          PATH: /usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
        timeout-minutes: 150

      - name: Upload big core outputs
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.conf }}-big
          path: |
            output/${{ matrix.conf }}/big/
            output/${{ matrix.conf }}/common/
            src/big/rt-smart/userapps/root/
          retention-days: 1

  # ── 小核：Linux + U-Boot + little-core OpenSBI ──
  build-little:
    name: "小核 (Linux+U-Boot)  ${{ matrix.conf }}"
    if: github.ref_type == 'tag'
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        conf:
          - k230_canmv_01studio_defconfig

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install system dependencies
        run: |
          sudo dpkg --add-architecture i386
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends \
            cmake flex bison m4 fakeroot attr zlib1g-dev \
            bc cpio unzip rsync file make binutils build-essential \
            gcc g++ bash patch gzip bzip2 perl tar dosfstools mtools \
            autoconf automake pkg-config libc6-dev-i386 libncurses5:i386 \
            libssl-dev libncurses5-dev libconfuse2 libconfuse-dev \
            python3 python3-pip python-is-python3 scons wget curl
          pip3 install pycryptodome gmssl


      - name: Restore toolchain cache
        id: cache-tc
        uses: actions/cache@v4
        with:
          path: toolchain
          key: toolchain-${{ matrix.conf }}-${{ hashFiles('Makefile', 'configs/k230_canmv_01studio_defconfig') }}-v4

      - name: Restore source cache
        id: cache-src
        uses: actions/cache@v4
        with:
          path: |
            src/.src_fetched
            src/big/utils
            src/big/ai
            src/big/kmodel
            src/big/nncase
            src/little/utils/firmware
            src/little/buildroot-ext/dl
            src/little/buildroot-ext/package/tuning-server
          key: sources-${{ matrix.conf }}-${{ hashFiles('Makefile', 'configs/k230_canmv_01studio_defconfig') }}-v4

      - name: Mark toolchain ready (cache hit)
        if: steps.cache-tc.outputs.cache-hit == 'true'
        run: mkdir -p toolchain && touch toolchain/.toolchain_ready

      - name: Prepare toolchain & sources
        if: steps.cache-tc.outputs.cache-hit != 'true' || steps.cache-src.outputs.cache-hit != 'true'
        run: make prepare_sourcecode CONF=${{ matrix.conf }}

      - name: Link toolchain to /opt/toolchain
        run: sudo ln -sf "$(pwd)/toolchain" /opt/toolchain

      - name: Restore Linux hot cache (drivers)
        uses: actions/cache/restore@v4
        with:
          path: output/${{ matrix.conf }}/little/linux/drivers
          key: linux-hot-${{ matrix.conf }}-${{ github.run_number }}
          restore-keys: linux-hot-${{ matrix.conf }}-

      - name: Restore Linux cold cache (rest)
        uses: actions/cache/restore@v4
        with:
          path: output/${{ matrix.conf }}/little/linux
          key: linux-cold-${{ matrix.conf }}-${{ github.run_number }}
          restore-keys: linux-cold-${{ matrix.conf }}-

      - name: Build Linux + U-Boot + little-core OpenSBI
        run: make CONF=${{ matrix.conf }} linux uboot little-core-opensbi
        env:
          PATH: /usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
        timeout-minutes: 80

      - name: Save Linux hot cache (drivers)
        uses: actions/cache/save@v4
        with:
          path: output/${{ matrix.conf }}/little/linux/drivers
          key: linux-hot-${{ matrix.conf }}-${{ github.run_number }}

      - name: Save Linux cold cache (rest)
        uses: actions/cache/save@v4
        with:
          path: output/${{ matrix.conf }}/little/linux
          key: linux-cold-${{ matrix.conf }}-${{ github.run_number }}

      - name: Upload linux/uboot/opensbi outputs
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.conf }}-little
          path: |
            output/${{ matrix.conf }}/little/
          retention-days: 1

  # ── rootfs：Buildroot（独立并行） ──
  build-rootfs:
    name: "RootFS (Buildroot)  ${{ matrix.conf }}"
    if: github.ref_type == 'tag'
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        conf:
          - k230_canmv_01studio_defconfig

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install system dependencies
        run: |
          sudo dpkg --add-architecture i386
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends \
            cmake flex bison m4 fakeroot attr zlib1g-dev \
            bc cpio unzip rsync file make binutils build-essential \
            gcc g++ bash patch gzip bzip2 perl tar dosfstools mtools \
            autoconf automake pkg-config libc6-dev-i386 libncurses5:i386 \
            libssl-dev libncurses5-dev libconfuse2 libconfuse-dev \
            python3 python3-pip python-is-python3 scons wget curl
          pip3 install pycryptodome gmssl


      - name: Restore toolchain cache
        id: cache-tc
        uses: actions/cache@v4
        with:
          path: toolchain
          key: toolchain-${{ matrix.conf }}-${{ hashFiles('Makefile', 'configs/k230_canmv_01studio_defconfig') }}-v4

      - name: Restore source cache
        id: cache-src
        uses: actions/cache@v4
        with:
          path: |
            src/.src_fetched
            src/big/utils
            src/big/ai
            src/big/kmodel
            src/big/nncase
            src/little/utils/firmware
            src/little/buildroot-ext/dl
            src/little/buildroot-ext/package/tuning-server
          key: sources-${{ matrix.conf }}-${{ hashFiles('Makefile', 'configs/k230_canmv_01studio_defconfig') }}-v4

      - name: Mark toolchain ready (cache hit)
        if: steps.cache-tc.outputs.cache-hit == 'true'
        run: mkdir -p toolchain && touch toolchain/.toolchain_ready

      - name: Prepare toolchain & sources
        if: steps.cache-tc.outputs.cache-hit != 'true' || steps.cache-src.outputs.cache-hit != 'true'
        run: make prepare_sourcecode CONF=${{ matrix.conf }}

      - name: Link toolchain to /opt/toolchain
        run: sudo ln -sf "$(pwd)/toolchain" /opt/toolchain


      - name: Build buildroot (with host-m4 + host-fakeroot glibc 2.35 patches)
        run: |
          OUT="output/${{ matrix.conf }}/little/buildroot-ext/build"
          # ── 辅助函数 ──
          patch_m4() {
            local f="$OUT/host-m4-1.4.18/lib/c-stack.c"
            if [ -f "$f" ]; then
              sed -i 's|# *if.*SIGSTKSZ *< *16384|#if 0 /* CI: SIGSTKSZ not constant */|' "$f"
              sed -i 's|# *elif.*SIGSTKSZ *< *16384|#elif 0 /* CI: SIGSTKSZ not constant */|' "$f"
              echo "✅ patched host-m4 c-stack.c"
            else echo "  host-m4 not yet extracted"; fi
          }
          patch_fakeroot() {
            local f1="$OUT/host-fakeroot-1.25.3/libfakeroot.c"
            local f2="$OUT/host-fakeroot-1.25.3/config.h"
            if [ -f "$f1" ]; then
              head -1 "$f1" | grep -q "_STAT_VER" || sed -i '1i#define _STAT_VER 1' "$f1"
              [ -f "$f2" ] && sed -i 's/^#define WRAP_MKNOD.*/#define WRAP_MKNOD __xmknod_old/' "$f2"
              echo "✅ patched host-fakeroot (_STAT_VER + __xmknod)"
            else echo "  host-fakeroot not yet extracted"; return 1; fi
          }
          del_s() { local d="$1"; shift; for f in "$@"; do rm -f "$d/$f"; done; }
          # ── Round 1: buildroot 完整跑 ──
          echo "═══ Round 1: configure + extract ═══"
          make CONF=${{ matrix.conf }} buildroot 2>&1 || true
          patch_m4
          # 校验 m4 补丁
          [ -f "$OUT/host-m4-1.4.18/lib/c-stack.c" ] && \
            grep -q '#elif 0' "$OUT/host-m4-1.4.18/lib/c-stack.c" || \
            { echo "❌ m4 补丁失败（版本可能变了）"; exit 1; }
          # 删除 cpio.mk 中的 mknod（GitHub runner 无 CAP_MKNOD）
          CPIO_MK="$(ls src/little/buildroot-ext/buildroot-*/fs/cpio/cpio.mk 2>/dev/null | head -1)"
          if [ -f "$CPIO_MK" ]; then
            sed -i 's/^\t*mknod /#CI-DISABLED mknod /' "$CPIO_MK"
            echo "✅ patched cpio.mk (removed mknod)"
          fi
          # ── Round 2: 增量编译 → m4 ✅，fakeroot 也会被解压 ──
          echo "═══ Round 2: build m4 + extract fakeroot ═══"
          rm -f "$OUT/host-m4-1.4.18/.stamp_built"   # 删 stamp 确保重编
          make CONF=${{ matrix.conf }} buildroot-rebuild 2>&1 || true
          if patch_fakeroot; then
            # 校验 fakeroot 补丁
            grep -q '#define _STAT_VER 1' "$OUT/host-fakeroot-1.25.3/libfakeroot.c" || \
              { echo "❌ fakeroot _STAT_VER 补丁失败"; exit 1; }
            del_s "$OUT/host-fakeroot-1.25.3" \
              .stamp_configured .stamp_built .stamp_installed
          else
            # 极端情况: 手动提取 fakeroot
            BRD="output/${{ matrix.conf }}/little/buildroot-ext"
            BRW="$(ls "$BRD"/buildroot-*/ 2>/dev/null | head -1)"
            [ -n "$BRW" ] && PATH="$BRD/host/bin:$PATH" \
              make -C "$BRW" CONF=${{ matrix.conf }} host-fakeroot-extract 2>/dev/null || \
              make CONF=${{ matrix.conf }} buildroot 2>&1 || true  # fallback: 完整跑直到 fakeroot 解压
            patch_fakeroot
            grep -q '#define _STAT_VER 1' "$OUT/host-fakeroot-1.25.3/libfakeroot.c" 2>/dev/null || \
              { echo "❌ fakeroot 补丁失败（手动提取后）"; exit 1; }
            del_s "$OUT/host-fakeroot-1.25.3" \
              .stamp_configured .stamp_built .stamp_installed
          fi
          # ── Round 3: buildroot-rebuild（增量，比完整 buildroot 快很多） ──
          echo "═══ Round 3: buildroot-rebuild ═══"
          # Stub makedevs: GitHub runner 无 CAP_MKNOD，makedevs 创建设备节
点会失败
          MB="output/${{ matrix.conf }}/little/buildroot-ext/host/bin/makedevs"
          if [ -f "$MB" ] && ! head -1 "$MB" | grep -q '\[CI-NOOP\]'; then
            mv "$MB" "$MB.real"
            printf '#!/bin/sh\necho "[CI-NOOP] makedevs skipped"\nexit 0\n' > "$MB"
            chmod +x "$MB"
            echo "✅ stubbed makedevs (no CAP_MKNOD)"
          fi
          make CONF=${{ matrix.conf }} buildroot-rebuild 2>&1 || \
            { echo "⚠️ rebuild failed → fallback full buildroot"; \
              make CONF=${{ matrix.conf }} buildroot 2>&1 || \
              { echo "❌ buildroot 完全失败"; exit 1; }; }
          # ── Fix cpio mknod（GitHub Runner 无 CAP_MKNOD） ──
          CPIO="output/${{ matrix.conf }}/little/buildroot-ext/images/rootfs.cpio"
          FSCR="output/${{ matrix.conf }}/little/buildroot-ext/build/buildroot-fs/cpio/fakeroot"
          if [ -f "$FSCR" ] && [ ! -f "$CPIO" ]; then
            echo "🔧 Patch cpio fakeroot (skip mknod)..."
            sed -i 's/^\(.*mknod \)/echo \[CI-SKIP\] \1/' "$FSCR"
            HB="output/${{ matrix.conf }}/little/buildroot-ext/host/bin"
            PATH="$HB:$HB/../sbin:$PATH" bash "$FSCR" && touch "$CPIO"
            echo "✅ cpio done → finalize"
            make CONF=${{ matrix.conf }} buildroot-rebuild 2>&1 || true
          fi
          # ── Verify ──
          echo "=== buildroot images ==="
          ls -la output/${{ matrix.conf }}/little/buildroot-ext/images/ || \
            { echo "❌ images/ missing"; exit 1; }
        env:
          PATH: /usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
        timeout-minutes: 80

      - name: Upload buildroot outputs
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.conf }}-rootfs
          path: |
            output/${{ matrix.conf }}/little/buildroot-ext/
          retention-days: 1

  # ── 合并 ──
  merge:
    name: "打包镜像  ${{ matrix.conf }}"
    if: github.ref_type == 'tag'
    needs: [build-big, build-little, build-rootfs]
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        conf:
          - k230_canmv_01studio_defconfig

    steps:
      - uses: actions/checkout@v4

      - name: Install genimage + tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends \
            fakeroot dosfstools mtools cpio unzip rsync file bc \
            libconfuse2 libconfuse-dev
          wget -q https://github.com/pengutronix/genimage/releases/download/v16/genimage-16.tar.xz \
            -O /tmp/genimage.tar.xz
          cd /tmp && tar -xf genimage.tar.xz
          cd genimage-16 && ./configure && make -j"$(nproc)" && sudo make install

      - name: Restore source cache
        uses: actions/cache/restore@v4
        with:
          path: |
            src/.src_fetched
            src/big/utils
            src/big/ai
            src/big/kmodel
            src/big/nncase
            src/little/utils/firmware
            src/little/buildroot-ext/dl
            src/little/buildroot-ext/package/tuning-server
          key: sources-${{ matrix.conf }}-${{ hashFiles('Makefile', 'configs/k230_canmv_01studio_defconfig') }}-v4

      - name: Prepare output structure
        run: |
          mkdir -p output/${{ matrix.conf }}/images
          make CONF=${{ matrix.conf }} prepare_memory
        env:
          PATH: /usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin

      - name: Restore toolchain
        uses: actions/cache@v4
        with:
          path: toolchain
          key: toolchain-${{ matrix.conf }}-${{ hashFiles('Makefile', 'configs/k230_canmv_01studio_defconfig') }}-v4

      - name: Link toolchain to /opt/toolchain
        run: |
          sudo ln -sf "$(pwd)/toolchain" /opt/toolchain
          ls /opt/toolchain/*/bin/*gcc 2>/dev/null || echo "⚠️ toolchain incomplete — check may fail"

      - name: Download big core artifact
        uses: actions/download-artifact@v4
        with:
          name: ${{ matrix.conf }}-big
          path: .

      - name: Download little core artifact
        uses: actions/download-artifact@v4
        with:
          name: ${{ matrix.conf }}-little
          path: output/${{ matrix.conf }}/

      - name: Download rootfs artifact
        uses: actions/download-artifact@v4
        with:
          name: ${{ matrix.conf }}-rootfs
          path: output/${{ matrix.conf }}/little/buildroot-ext/

      - name: Build image
        run: |
          mkdir -p output/${{ matrix.conf }}/images
          make CONF=${{ matrix.conf }} build-image
        env:
          PATH: /usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin

      - name: Package release
        run: |
          mkdir -p release
          IMG="output/${{ matrix.conf }}/images/sysimage-sdcard.img.gz"
          if [ -f "$IMG" ]; then
            cp "$IMG" "release/${{ matrix.conf }}_sysimage-sdcard.img.gz"
            ls -lh release/
          else
            echo "❌ Image not found: $IMG"
            find output/${{ matrix.conf }}/images/ -type f | head -20
            exit 1
          fi

      - name: Upload final image
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.conf }}
          path: release/
          retention-days: 7

  # ============================================================
  # GitHub Release：汇总全部构建产物
  # ============================================================
  release:
    name: GitHub Release
    if: github.ref_type == 'tag'
    needs: merge
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: 'k230_canmv*'
          merge-multiple: true
          path: release

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ github.ref_name }}
          files: release/*
          generate_release_notes: true
